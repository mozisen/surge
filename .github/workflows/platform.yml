name: Platform regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node tests/install-form.cjs
      - run: sh -n scripts/install-agent.sh && sh -n scripts/install-panel.sh && sh -n scripts/vaio-panel && sh -n scripts/vaio-agent && bash -n vendor/vless-server.sh
      - run: git diff --check
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vaio-panel:test platform
